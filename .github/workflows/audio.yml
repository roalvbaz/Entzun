name: Generar audio

# Se lanza a mano: GitHub -> Actions -> "Generar audio" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "muestra = voces de euskera en un audio corto; episodios = los 24 MP3"
        type: choice
        options: [muestra, episodios]
        default: muestra
      motor:
        description: "Solo para 'episodios': motor de voz"
        type: choice
        options: [aho, piper]
        default: aho
      tono_eu:
        description: "Solo para 'episodios': tono del euskera (1.0 = original, 0.85 = mas grave)"
        type: string
        default: "1.0"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng cmake g++ make
          pip install -q piper-tts phoonnx edge-tts

      - name: Compilar AhoTTS (UPV/EHU, CC BY-SA)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"   # AhoTTS usa un CMake antiguo
          LIBRARY_PATH: ${{ github.workspace }}/AhoTTS/lib   # su link_directories apunta mal
        run: |
          git clone --depth 1 https://github.com/aholab/AhoTTS.git AhoTTS
          cd AhoTTS
          rm -f bin/tts bin/tts_client bin/tts_server lib/libhtts.a   # forzar compilacion real
          bash script_compile_all_linux.sh
          test -x bin/tts || { echo "ERROR: AhoTTS no compilo"; exit 1; }
          ls -la bin

      - name: Muestras de voz
        if: ${{ inputs.modo == 'muestra' }}
        continue-on-error: true
        run: |
          mkdir -p muestras
          M=herramientas/muestra.md
          python generar_podcast.py $M --motor aho   --salida muestras/aho.mp3                       || echo "FALLO aho"
          python generar_podcast.py $M --motor aho   --salida muestras/aho-grave.mp3  --tono-eu 0.85 || echo "FALLO aho-grave"
          python generar_podcast.py $M --motor piper --salida muestras/piper-dii.mp3                 || echo "FALLO piper"
          python generar_podcast.py $M --motor piper --salida muestras/piper-dii-grave.mp3 --tono-eu 0.9 || echo "FALLO piper-grave"
          ls -la muestras

      - name: Episodios
        if: ${{ inputs.modo == 'episodios' }}
        run: |
          python generar_podcast.py guiones/*.md --motor "${{ inputs.motor }}" --tono-eu "${{ inputs.tono_eu }}"
          ls -la podcasts

      - name: Subir resultado al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muestras podcasts
          git diff --cached --quiet && { echo "Nada que subir"; exit 0; }
          git commit -m "Audio generado (${{ inputs.modo }}, motor ${{ inputs.motor }})"
          git push
